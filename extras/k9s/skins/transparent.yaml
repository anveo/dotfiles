# k9s stock colors, but every background uses the terminal's own background
# ("default") instead of ANSI black, which Ghostty's default-dark maps to gray.
k9s:
  body:
    fgColor: dodgerblue
    bgColor: default
    logoColor: orange
  prompt:
    fgColor: cadetblue
    bgColor: default
    suggestColor: dodgerblue
  info:
    fgColor: orange
    sectionColor: white
  dialog:
    fgColor: dodgerblue
    bgColor: default
    buttonFgColor: black
    buttonBgColor: dodgerblue
    buttonFocusFgColor: white
    buttonFocusBgColor: fuchsia
    labelFgColor: fuchsia
    fieldFgColor: dodgerblue
  frame:
    border:
      fgColor: dodgerblue
      focusColor: lightskyblue
    menu:
      fgColor: white
      keyColor: dodgerblue
      numKeyColor: fuchsia
    crumbs:
      fgColor: black
      bgColor: aqua
      activeColor: orange
    status:
      newColor: lightskyblue
      modifyColor: greenyellow
      addColor: white
      errorColor: orangered
      highlightColor: aqua
      killColor: mediumpurple
      completedColor: lightslategray
    title:
      fgColor: aqua
      bgColor: default
      highlightColor: fuchsia
      counterColor: papayawhip
      filterColor: steelblue
  views:
    charts:
      bgColor: default
      defaultDialColors:
        - linegreen
        - orangered
      defaultChartColors:
        - linegreen
        - orangered
    table:
      fgColor: aqua
      bgColor: default
      cursorFgColor: black
      cursorBgColor: aqua
      markColor: palegreen
      header:
        fgColor: white
        bgColor: default
        sorterColor: orange
    xray:
      fgColor: aqua
      bgColor: default
      cursorColor: dodgerblue
      cursorTextColor: black
      graphicColor: cadetblue
    yaml:
      keyColor: steelblue
      colonColor: white
      valueColor: papayawhip
    logs:
      fgColor: white
      bgColor: default
      indicator:
        fgColor: dodgerblue
        bgColor: default
        toggleOnColor: limegreen
        toggleOffColor: gray
