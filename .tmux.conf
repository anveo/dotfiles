###########################################################################

# Change prefix from default (C-b) to C-Space
# unbind C-b
set -g prefix C-Space
#bind Space send-prefix

# send the prefix to client inside window (nested sessions like overmind)
# this may conflict with 1password's autofill
bind-key -n 'C-\' send-prefix

###########################################################################
# General options

# Bump history limit
set -g history-limit 16348

# Notifying if other windows has activities
setw -g monitor-activity off
set -g visual-activity off

set-option -g set-titles on
set -g set-titles-string '#S / #{b:pane_current_path} — #W'

# 0 is too far
set -g base-index 1
setw -g pane-base-index 1

# Window Ordering
set-option -g renumber-windows on

# shorten command delay
set -s escape-time 1

# How long a `bind -r` key stays live after the prefix, so it can be tapped
# repeatedly without re-pressing the prefix (default 500ms). Applies to every
# -r binding, including the H/J/K/L pane resizes below -- during this window
# those keys are captured by tmux, so a literal "Hello" typed within 1s of a
# prefix+H will lose its H. Drop back to 500 if that bites.
set -g repeat-time 1000

###########################################################################
# General keymap

# `+r reloads the configuration, handy
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Clear Screen
bind C-l send-keys 'C-l'

# Custom status bar
# Powerline symbols:     

# Terminal capabilities (tmux-256color supports modern mouse protocols)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-ghostty:RGB"

# Extended keys (CSI-u) for proper modifier key handling through Ghostty
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# OSC 52 clipboard — lets tmux write to system clipboard via Ghostty
# Works alongside existing pbcopy bindings as a fallback
set -s set-clipboard on

# Properly handle focus events from the terminal (fixes single-click pane selection)
set -g focus-events on

###########################################################################
## Status Bar

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 32
set -g status-right-length 150

# Center the window list in the status line
set -g status-justify centre

# set the status line's colors
set -g status-style fg=white,bg=colour234

# prompt/message line (rename-window, command prompt) -- default is black-on-yellow
set -g message-style fg=white,bg=colour24,bold
set -g message-command-style fg=colour39,bg=colour234,bold

# session name, plus a magenta dot while the prefix key is pending. Both branches
# render the same glyph so the width never changes and the window list can't shift.
set -g status-left '#[fg=colour16,bg=colour254,bold] #S #[fg=colour254,bg=colour234,nobold] #{?client_prefix,#[fg=colour96]●,#[fg=colour234]●} #[default]'

# SYNC warns that synchronize-panes is on
set -g status-right '#{?pane_synchronized,#[bg=colour196] SYNC #[bg=colour234],}#[fg=colour250]| %R %Z | #(TZ="UTC" date +%%H:%%M) UTC | %Y-%m-%d #[fg=colour254,bg=colour234,nobold]#[fg=colour16,bg=colour254,bold] #h '

set -g window-status-format "#[fg=white,bg=colour234] #I #W "
set -g window-status-current-format "#[fg=colour234,bg=colour39]#[fg=colour16,bg=colour39,noreverse,bold] #I | #W #[fg=colour39,bg=colour234,nobold] #{?window_zoomed_flag,#[fg=colour206] #[fg=white]#[bg=colour206]<<< ZOOM >>>#[fg=colour206]#[bg=colour234] ,}"

unbind l
#bind C-a last-window

# screen habit
bind C-c new-window

# Copy mode
unbind [
bind Space copy-mode
# NB: do not bind C-Space here. The prefix is C-Space, so a double-tap (easy to
# do accidentally with key repeat) would drop you into copy mode, where every
# subsequent key becomes a vi motion. Use prefix + Space.

# Use Vi mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
bind -T copy-mode-vi 'Y' send -X copy-end-of-line
bind -T copy-mode-vi 'V' send -X copy-rectangle-toggle
unbind p
bind p paste-buffer
bind -T copy-mode-vi y send -X copy-pipe "pbcopy"
bind C-c run "tmux save-buffer - | pbcopy"
bind C-v run \
"tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"

# Update default binding of `Enter` to also use copy-pipe
# unbind -t vi-copy Enter
# bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

unbind p
bind p paste-buffer

# Make mouse useful in copy mode
set -g mouse on

###########################################################################
# Pane management / navigation

# More straight forward key bindings for splitting.
# Mnemonic is the orientation of the resulting divider, not tmux's -h/-v naming:
#   v / |  -> vertical divider   -> panes side by side (tmux -h)
#   h / -  -> horizontal divider -> panes stacked      (tmux -v)
unbind %
unbind '"'
bind | split-window -h
bind v split-window -h
bind - split-window -v
bind h split-window -v

bind q previous-window
bind e next-window
bind Tab last-window

# Fuzzy window switcher (current session, fzf)
bind w display-popup -E "\
  tmux list-windows -F '#{window_index}: #{window_name} — #{pane_current_command}' \
  | fzf --reverse --no-info \
  | cut -d: -f1 \
  | xargs -I{} tmux select-window -t {}"

# Window ordering: move the current window left/right in the window list.
# Uppercase of q/e is taken (E is "spread panes evenly"), so C- of the window
# nav keys. -r makes them repeatable: prefix once, then tap C-q C-q C-q.
# `:-1` / `:+1` wrap at the ends and always succeed, so overshooting cycles
# round rather than erroring out mid-repeat.
# NB: prefix + < already opens tmux's window menu, which has Swap Left (l) and
# Swap Right (r) plus Swap Marked -- that's why < / > are left alone here.
bind -r C-q swap-window -d -t :-1
bind -r C-e swap-window -d -t :+1

# Window resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim-tmux-navigator and fzf
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || \
                 tmux select-pane -L"

bind -n C-j run "($is_vim && tmux send-keys C-j)  || \
                 ($is_fzf && tmux send-keys C-j) || \
                 tmux select-pane -D"

bind -n C-k run "($is_vim && tmux send-keys C-k) || \
                 ($is_fzf && tmux send-keys C-k)  || \
                 tmux select-pane -U"

# C-l: forward to vim; else if this pane is at the right edge (nowhere to
# navigate) clear the screen; else move to the pane on the right.
# NB: `select-pane -R` returns success even when it can't move, so its exit
# code is useless as a "did we move?" signal -- test pane_at_right instead.
bind -n C-l if-shell "$is_vim" "send-keys C-l" \
  "if-shell -F '#{pane_at_right}' 'send-keys C-l' 'select-pane -R'"

# bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Zoooom
bind-key Up resize-pane -Z
bind-key Down resize-pane -Z

###########################################################################
# tmux-resurrect plugin

# for vim
set -g @resurrect-strategy-vim 'session'

# for neovim
set -g @resurrect-strategy-nvim 'session'

# restore pane contents
#set -g @resurrect-capture-pane-contents 'on'

###########################################################################
# tmux-continuum plugin

# Autosave interval in minutes. 15 is also continuum's built-in default; set here
# so the value is visible in this file rather than living only in the plugin.
set -g @continuum-save-interval '15'

###########################################################################
# os specific files

# Load mac-specific settings
# if-shell "uname | grep -q Darwin" "source-file ~/.tmux.mac.conf"
# load private settings if they exist
# -q so a missing file is not an error; this replaces an if-shell wrapper.
# tpack cannot parse source/source-file inside a command list (quoted OR braced)
# and aborts `tpack install` for the whole config when it sees one, so keep this
# as a plain top-level source-file.
source-file -q ~/.tmux.private

