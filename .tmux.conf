# Initializes TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf.
# run -b '~/.tmux/plugins/tpm/tpm'

# List of plugins — declare all @plugin lines BEFORE `tpack init`.
# tpack reads the manifest when init runs; anything after it is ignored.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initializes the plugin manager. Keep this line at the very bottom of tmux.conf.
run 'tpack init'
