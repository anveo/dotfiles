name: Check

# make check on Linux and macOS: every tracked shell file parses, and the
# behaviour tests pass. Claude reviews read this result (see claude.yml).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # fzf: test/zsh_config_test.sh checks that Tab goes through fzf's
      # completion, which only exists when fzf is installed.
      - name: Install zsh and fzf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fzf

      # The runner's /home/linuxbrew is group-writable, and .zshrc puts its
      # site-functions on fpath. compinit's first full run then finds insecure
      # directories, asks whether to continue, gets no answer without a
      # terminal, and aborts -- so compdef is never defined. Remove group and
      # other write from whatever compaudit flags, as the zsh docs advise.
      - name: Secure completion directories (Linux)
        if: runner.os == 'Linux'
        run: |
          zsh -fc 'fpath=(/home/linuxbrew/.linuxbrew/share/zsh/site-functions $fpath); autoload -Uz compaudit; compaudit' \
            | xargs -r sudo chmod g-w,o-w

      - name: Install fzf (macOS)
        if: runner.os == 'macOS'
        run: brew install fzf

      # .zshrc and test/zsh_config_test.sh load antidote from ~/.antidote.
      - name: Install antidote
        run: git clone --depth=1 https://github.com/mattmc3/antidote.git ~/.antidote

      - name: make check
        run: make check
