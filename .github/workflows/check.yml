name: Check

# make check on Linux and macOS: every tracked shell file parses, and the
# behaviour tests pass. Claude reviews read this result (see claude.yml).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # fzf: test/zsh_config_test.sh checks that Tab goes through fzf's
      # completion, which only exists when fzf is installed.
      - name: Install zsh and fzf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fzf

      - name: Install fzf (macOS)
        if: runner.os == 'macOS'
        run: brew install fzf

      # .zshrc reads the repo from ~/dotfiles (DOTFILES=$HOME/dotfiles), where
      # every real install lives; the runner checks out elsewhere.
      - name: Link the checkout to ~/dotfiles
        run: ln -s "$GITHUB_WORKSPACE" ~/dotfiles

      # .zshrc and test/zsh_config_test.sh load antidote from ~/.antidote.
      - name: Install antidote
        run: git clone --depth=1 https://github.com/mattmc3/antidote.git ~/.antidote

      - name: make check
        run: make check
