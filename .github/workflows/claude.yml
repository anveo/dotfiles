name: Claude Code

# Runs only when someone mentions @claude: reviews are requested by hand (e.g.
# "@claude review this PR" once it is ready for review), never on push.
# claude-code-action only acts for users with write access to the repo.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One run per issue or PR at a time. A second mention queues behind the first
# rather than cancelling it, so a reply in progress is never lost.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so a review can diff against main and read the
          # commit series instead of guessing at HEAD~N.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Lets Claude read CI results (the Check workflow runs make check).
          additional_permissions: |
            actions: read

          # Opus for reviews. Read-only git and gh commands so it can see the
          # full diff, the commit series and the Check workflow's result.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*)"
